repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-toml

  - repo: local
    hooks:
      # --- backend ---
      - id: black
        name: black (backend)
        entry: python scripts/precommit-black.py
        language: system
        files: ^backend/.*\.py$

      - id: ruff
        name: ruff (backend)
        entry: python scripts/precommit-ruff.py
        language: system
        files: ^backend/.*\.py$

      - id: pytest
        name: pytest (backend)
        entry: poetry -C backend run pytest
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      # --- frontend ---
      - id: eslint
        name: eslint (frontend)
        entry: npx --prefix frontend eslint --fix
        language: system
        files: ^frontend/.*\.(ts|html)$

      - id: prettier
        name: prettier (frontend)
        entry: npx --prefix frontend prettier --write
        language: system
        files: ^frontend/.*\.(ts|html|scss|css|json)$
        exclude: ^frontend/(tsconfig.*\.json|angular\.json|package(-lock)?\.json)$

      # --- commit messages ---
      - id: commitlint
        name: commitlint
        entry: npx --no -- commitlint --edit
        language: system
        stages: [commit-msg]
        pass_filenames: false
