repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-toml

  - repo: local
    hooks:
      # --- backend ---
      - id: black
        name: black (backend)
        entry: python scripts/precommit-black.py backend/
        language: system
        files: ^backend/.*\.py$

      - id: ruff
        name: ruff (backend)
        entry: python scripts/precommit-ruff.py backend/
        language: system
        files: ^backend/.*\.py$

      - id: pytest
        name: pytest (backend)
        entry: poetry -C backend run pytest
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      # --- processing ---
      - id: black
        name: black (processing)
        entry: python scripts/precommit-black.py processing/
        language: system
        files: ^processing/.*\.py$

      - id: ruff
        name: ruff (processing)
        entry: python scripts/precommit-ruff.py processing/
        language: system
        files: ^processing/.*\.py$

      - id: pytest
        name: pytest (processing)
        entry: poetry -C processing run pytest
        language: system
        files: ^processing/.*\.py$
        pass_filenames: false

      # --- frontend ---
      - id: eslint
        name: eslint (frontend)
        entry: npx --prefix frontend eslint --fix
        language: system
        files: ^frontend/.*\.(ts|html)$

      - id: prettier
        name: prettier (frontend)
        entry: npx --prefix frontend prettier --write
        language: system
        files: ^frontend/.*\.(ts|html|scss|css|json)$
        exclude: ^frontend/(tsconfig.*\.json|angular\.json|package(-lock)?\.json)$

      # --- commit messages ---
      - id: commitlint
        name: commitlint
        entry: npx --no -- commitlint --edit
        language: system
        stages: [commit-msg]
        pass_filenames: false

      # --- coverage reporting ---
      # Runs at pre-push, not pre-commit, because each of these needs the whole
      # suite rather than the changed files: the backend hook needs a Docker
      # daemon for its testcontainers, and the others take long enough that
      # running them on every commit would be rude. Each threshold lives in ONE
      # place and is read by the tool, so no percentage is repeated here.
      - id: pytest-coverage
        name: pytest coverage report (backend)
        entry: poetry -C backend run pytest --cov --cov-report=term-missing
        language: system
        stages: [pre-push]
        files: ^backend/.*\.py$
        pass_filenames: false
        always_run: true

      - id: pytest-coverage-processing
        name: pytest coverage report (processing)
        entry: poetry -C processing run pytest --cov --cov-report=term-missing
        language: system
        stages: [pre-push]
        files: ^processing/.*\.py$
        pass_filenames: false
        always_run: true

      - id: vitest-coverage
        name: vitest coverage report (frontend)
        entry: npx --prefix frontend ng test --coverage --watch=false
        language: system
        stages: [pre-push]
        files: ^frontend/.*\.(ts|html|json)$
        pass_filenames: false
        always_run: true
