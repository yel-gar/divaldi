repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-toml

  - repo: local
    hooks:
      # --- backend ---
      - id: black
        name: black (backend)
        entry: python scripts/precommit-black.py backend/
        language: system
        files: ^backend/.*\.py$

      - id: ruff
        name: ruff (backend)
        entry: python scripts/precommit-ruff.py backend/
        language: system
        files: ^backend/.*\.py$

      - id: pytest
        name: pytest (backend)
        entry: poetry -C backend run pytest
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      # --- processing ---
      - id: black
        name: black (processing)
        entry: python scripts/precommit-black.py processing/
        language: system
        files: ^processing/.*\.py$

      - id: ruff
        name: ruff (processing)
        entry: python scripts/precommit-ruff.py processing/
        language: system
        files: ^processing/.*\.py$

      - id: pytest
        name: pytest (processing)
        entry: poetry -C processing run pytest
        language: system
        files: ^processing/.*\.py$
        pass_filenames: false

      # --- frontend ---
      - id: eslint
        name: eslint (frontend)
        entry: npx --prefix frontend eslint --fix
        language: system
        files: ^frontend/.*\.(ts|html)$

      - id: prettier
        name: prettier (frontend)
        entry: npx --prefix frontend prettier --write
        language: system
        files: ^frontend/.*\.(ts|html|scss|css|json)$
        exclude: ^frontend/(tsconfig.*\.json|angular\.json|package(-lock)?\.json)$

      # --- commit messages ---
      - id: commitlint
        name: commitlint
        entry: npx --no -- commitlint --edit
        language: system
        stages: [commit-msg]
        pass_filenames: false

      # --- coverage reporting ---
      # Runs at pre-push, not pre-commit, because it needs the whole suite
      # (a Docker daemon for testcontainers) and is a reporting gate rather
      # than a formatting one. `fail_under` in backend/pyproject.toml is 0,
      # so this reports without blocking; raise it to 90 (and add
      # --cov-fail-under=90) once the chat routes and workers are covered.
      - id: pytest-coverage
        name: pytest coverage report (backend)
        entry: poetry -C backend run pytest --cov --cov-report=term-missing
        language: system
        stages: [pre-push]
        files: ^backend/.*\.py$
        pass_filenames: false
        always_run: true
