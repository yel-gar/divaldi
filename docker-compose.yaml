x-s3-env: &s3-env
  # Credentials for the object store. Garage cannot pre-declare an S3 key in
  # its config, so `garage-bootstrap` imports exactly this key with exactly
  # this secret on every start. That keeps them static, which is what lets the
  # backend read them from the environment with no credential handoff.
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-GKd1a1b2c3d4e5f60718293a4b5c6d}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?}

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-divaldi}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
  POSTGRES_DB: ${POSTGRES_DB:-divaldi}
  POSTGRES_HOST: db

x-backend-env: &backend-env
  <<: [*postgres-env, *s3-env]
  DEBUG: ${DEBUG:?}
  TEST_INSTANCE_MODE: ${TEST_INSTANCE_MODE:-false}
  BACKEND_URL: ${BACKEND_URL:-http://localhost:3000}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
  S3_REGION: ${S3_REGION:-garage}
  # Endpoint the backend uses for its own object reads and writes.
  S3_INTERNAL_URL: ${S3_INTERNAL_URL:-http://garage:3900}
  # Endpoint baked into presigned URLs, which the browser fetches directly and
  # therefore has to be reachable from the user's machine, not just the network.
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:3900}
  RABBITMQ_USER: ${RABBITMQ_USER:-admin}
  RABBITMQ_PASS: ${RABBITMQ_PASS:?}
  TASKIQ_API_TOKEN: ${TASKIQ_API_TOKEN:?}
  GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-3-Ultra}
  SBER_API_KEY: ${SBER_API_KEY:?}
  SBER_API_SCOPE: ${SBER_API_SCOPE:?}

x-backend-service: &backend-service
  build:
    context: .
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  environment:
    <<: *backend-env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    garage:
      condition: service_healthy
    garage-bootstrap:
      condition: service_completed_successfully
    garage-config:
      condition: service_completed_successfully

services:
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: ${BACKEND_URL:-http://localhost:3000}
    ports:
      - ${FRONTEND_PORT:-8080}:80
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-3000}
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    <<: *backend-service
    ports:
      - ${BACKEND_PORT:-3000}:3000

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *backend-env
    command: "poetry run alembic upgrade head"
    restart: no
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    <<: *backend-service
    command: "poetry run taskiq scheduler app.tasks.conf.scheduler:scheduler -fsd -tp 'app/tasks/*.py'"

  worker_default:
    <<: *backend-service
    command: "poetry run taskiq worker -w 2 app.tasks.conf.workers:default_worker -fsd -tp 'app/tasks/*.py'"
    deploy:
      replicas: 2

  worker_network:
    <<: *backend-service
    command: "poetry run taskiq worker -w 2 app.tasks.conf.workers:network_worker -fsd -tp 'app/tasks/*.py'"
    deploy:
      replicas: 2

  taskiq_dashboard:
    image: ghcr.io/danfimov/taskiq-dashboard:v0.4.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TASKIQ_DASHBOARD__STORAGE_TYPE: postgres
      TASKIQ_DASHBOARD__POSTGRES__HOST: db
      TASKIQ_DASHBOARD__API__TOKEN: ${TASKIQ_API_TOKEN:?}
      TASKIQ_DASHBOARD__POSTGRES__USER: ${POSTGRES_USER:-divaldi}
      TASKIQ_DASHBOARD__POSTGRES__PASSWORD: ${POSTGRES_PASSWORD:?}
      TASKIQ_DASHBOARD__POSTGRES__DATABASE: taskiq_dashboard
    ports:
      - "${TASKIQ_DASHBOARD_PORT:-8000}:8000"

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      <<: *postgres-env
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./conf/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-divaldi} -d ${POSTGRES_DB:-divaldi}",
        ]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s
    shm_size: '512mb'

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
      - ./conf/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?}
      RABBITMQ_DEFAULT_VHOST: taskiq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Garage is an S3-compatible object store. It replaced MinIO, whose
  # upstream repositories were deleted and are no longer pullable from any
  # registry.
  garage:
    image: dxflrs/garage:v2.4.1
    # --single-node assigns the cluster layout at startup, so there is no
    # separate layout bootstrap step. A real deployment should drop this flag,
    # raise replication_factor to 3 in conf/garage.toml and run 3+ nodes.
    # The image's own CMD is `/garage server` with no entrypoint, so the binary
    # has to be named explicitly rather than relying on an inherited entrypoint.
    command: ["/garage", "server", "--single-node"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?}
    volumes:
      - ./conf/garage.toml:/etc/garage.toml:ro
      # The metadata directory holds the cluster layout and the key database.
      # Losing it orphans the data, so it is a real volume and not a tmpfs.
      - garage_metadata:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "${S3_PORT:-3900}:3900"
      - "${GARAGE_ADMIN_PORT:-3903}:3903"
    healthcheck:
      # The admin API is the only endpoint that reports cluster readiness. A
      # bare `GET /` on the S3 port answers 403 as soon as the socket is open,
      # which is too early to declare healthy.
      test:
        [
          "CMD",
          "/garage",
          "--help",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Creates the two buckets and grants the application key access to them.
  # Garage's own image has no shell, so this builds a thin wrapper around it
  # that has busybox's shell plus the garage binary.
  garage-bootstrap:
    build:
      context: ./conf
      dockerfile: garage.Dockerfile
    depends_on:
      garage:
        condition: service_healthy
    environment:
      <<: *s3-env
      S3_INTERNAL_URL: ${S3_INTERNAL_URL:-http://garage:3900}
      # The CLI authenticates to the cluster with the same RPC secret the server
      # runs on, so it needs the same value.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?}
    volumes:
      # The CLI needs the config to learn rpc_public_addr and the metadata
      # directory to read the node key it authenticates with. Sharing the
      # metadata volume with the running server is what Garage's own container
      # examples do; the CLI opens it to read the key, not to write the database.
      - ./conf/garage.toml:/etc/garage.toml:ro
      - garage_metadata:/var/lib/garage/meta
      - ./conf/garage-init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: no

  # Applies the bucket configuration: expiration and CORS rules. This needs a
  # real S3 client because both APIs take XML on the wire and there is no garage
  # CLI command for either, so it runs on the backend image where aioboto3
  # already exists rather than adding a Python dependency to the bootstrap image.
  garage-config:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      garage-bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *s3-env
      S3_INTERNAL_URL: ${S3_INTERNAL_URL:-http://garage:3900}
      # Browser origins allowed to call the buckets directly. Defaults to `*`,
      # which is safe only because the buckets are private and reachable solely
      # through presigned URLs.
      S3_CORS_ORIGINS: ${S3_CORS_ORIGINS:-*}
    volumes:
      - ./conf/garage-rules:/rules:ro
    command: "poetry run python apply_s3_config.py"
    restart: no

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  garage_metadata:
  garage_data:
