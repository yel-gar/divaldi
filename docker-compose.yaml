x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-divaldi}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
  POSTGRES_DB: ${POSTGRES_DB:-divaldi}
  POSTGRES_HOST: db

services:
#  frontend:
#    build: ./frontend
#    ports:
#      - ${FRONTEND_PORT:-8080}:8080
#    environment:
#      BACKEND_PORT: ${BACKEND_PORT:-3000}
#      BACKEND_URL:
#    restart: unless-stopped
#    depends_on:
#      - backend

  backend:
    build: ./backend
    environment:
      <<: *postgres-env
      DEBUG: ${DEBUG:?}
    ports:
      - ${BACKEND_PORT:-3000}:3000
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      <<: *postgres-env
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-divaldi} -d ${POSTGRES_DB:-divaldi}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
