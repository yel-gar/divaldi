@if (overlay.isVisible()) {
  <div class="drag-overlay" role="presentation">
    <div class="drag-overlay__zone">
      <svg size="48" class="drag-overlay__icon" lucideCloudUpload aria-hidden="true"></svg>
      <p class="drag-overlay__text h3">Перетащите файлы сюда</p>
      <p class="drag-overlay__subtext h5">Поддерживаются: PDF, DXF, PNG, JPEG до 30 МБ.</p>
    </div>
  </div>
}
