<div class="input-wrapper">
  <ng-content select="[appInputPrefix]" />
  @if (leftIcon()) {
    @if (leftIconInteractive()) {
      <button
        type="button"
        class="input__icon input__icon--left input__icon--interactive"
        [attr.aria-label]="leftIconLabel()"
        (click)="onLeftIconClick($event)"
      >
        <svg [lucideIcon]="leftIcon() ?? null" size="20" aria-hidden="true"></svg>
      </button>
    } @else {
      <span class="input__icon input__icon--left" aria-hidden="true">
        <svg [lucideIcon]="leftIcon() ?? null" size="20" aria-hidden="true"></svg>
      </span>
    }
  }
  @if (asTextarea()) {
    <textarea
      #inputRef
      class="form-control form-control--textarea"
      [id]="inputId()"
      [placeholder]="placeholder()"
      [attr.maxlength]="maxLength() ?? null"
      [attr.aria-invalid]="showError()"
      [attr.aria-label]="ariaLabel() || null"
      [attr.autocomplete]="autocomplete()"
      [value]="displayValue"
      [disabled]="isDisabled()"
      [rows]="rows()"
      (input)="onInput($event)"
      (blur)="onBlur()"
    ></textarea>
  } @else {
    <input
      #inputRef
      class="form-control"
      [id]="inputId()"
      [type]="type()"
      [placeholder]="placeholder()"
      [attr.maxlength]="maxLength() ?? null"
      [attr.aria-invalid]="showError()"
      [attr.aria-label]="ariaLabel() || null"
      [attr.autocomplete]="autocomplete()"
      [value]="displayValue"
      [disabled]="isDisabled()"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />
  }
  @if (rightIcon()) {
    @if (rightIconInteractive()) {
      <button
        type="button"
        class="input__icon input__icon--right input__icon--interactive"
        [attr.aria-label]="rightIconLabel()"
        (click)="onRightIconClick($event)"
      >
        <svg [lucideIcon]="rightIcon() ?? null" size="20" aria-hidden="true"></svg>
      </button>
    } @else {
      <span class="input__icon input__icon--right" aria-hidden="true">
        <svg [lucideIcon]="rightIcon() ?? null" size="20" aria-hidden="true"></svg>
      </span>
    }
  }
  <ng-content select="[appInputSuffix]" />
</div>
