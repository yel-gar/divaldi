<div class="sidebar">
  <div class="sidebar__header">
    <div class="logo">
      <img src="/assets/svgs/logo.svg" alt="logo" width="48" />
      <div class="h1">Divaldi</div>
    </div>
    <button
      type="button"
      class="sidebar__toggle"
      [attr.aria-label]="collapsed() ? 'Развернуть меню' : 'Свернуть меню'"
      [attr.aria-expanded]="!collapsed()"
      (click)="toggleCollapsed()"
    >
      @if (collapsed()) {
      <svg size="20" lucidePanelLeftOpen aria-hidden="true"></svg>
      } @else {
      <svg size="20" lucidePanelLeftClose aria-hidden="true"></svg>
      }
    </button>
  </div>

  @if (role() === 'user') {
  <a class="button button--main cta h3" routerLink="/create">
    <svg class="cta__icon" lucidePlus></svg>
    <span>Создать заявку</span>
  </a>
  }

  <nav class="navigation" aria-label="Основная навигация">
    <ul class="navigation__list">
      @for (nav of navItems(); track nav.route) {
      <li>
        <a
          class="navigation__item h3"
          [routerLink]="nav.route"
          routerLinkActive="active-link"
          ariaCurrentWhenActive="page"
          [attr.title]="collapsed() ? nav.label : null"
        >
          <svg class="navigation__icon" [lucideIcon]="nav.icon"></svg>
          <span>{{nav.label}}</span>
        </a>
      </li>
      }
    </ul>
  </nav>
  <div class="profile">
    <img src="/assets/imgs/stock-man.jpg" alt="profile photo" class="photo" />
    <div class="profile__content">
      <div class="profile__info">
        <span class="profile__name h3">{{ displayName() }}</span>
        @if (user(); as currentUser) {
        <p class="profile__mail h4">&#64;{{ currentUser.username }}</p>
        }
      </div>
      <button
        type="button"
        class="profile__logout"
        aria-label="Выйти"
        [disabled]="isLoggingOut()"
        (click)="logout()"
      >
        <svg size="18" lucideLogOut aria-hidden="true"></svg>
      </button>
    </div>
  </div>
</div>
