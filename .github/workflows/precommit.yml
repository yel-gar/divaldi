name: Pre-commit checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit-root:
    name: Pre-commit (root config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-root-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit (root config)
        run: pre-commit run --all-files

  pre-commit-backend:
    name: Pre-commit (backend config)
    runs-on: ubuntu-latest
    # backend's pytest hook uses testcontainers, which needs a live Docker
    # daemon — available by default on GitHub-hosted ubuntu-latest runners,
    # no extra services: block required.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --with test,lint

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-backend-${{ hashFiles('backend/.pre-commit-config.yml') }}

      - name: Install pre-commit
        run: pipx install pre-commit

      - name: Run pre-commit (backend config)
        working-directory: backend
        run: poetry run pre-commit run --all-files --config .pre-commit-config.yml
