name: Backend Coverage

on:
  pull_request:
    paths: ["backend/**"]
  push:
    branches: [main]
    paths: ["backend/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Test coverage report
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-root

      # Testcontainers starts real PostgreSQL and Redis via the runner's
      # Docker daemon, which is available on ubuntu-latest by default.
      #
      # The threshold lives in ONE place: `fail_under` in
      # backend/pyproject.toml, which pytest-cov reads and enforces. It is
      # currently 0, so this step reports without blocking. To make 90% the
      # gate, set fail_under = 90 there and change nothing in this file.
      - name: Test with coverage
        run: poetry run pytest --cov --cov-report=term-missing --cov-report=json

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.json
          retention-days: 14
