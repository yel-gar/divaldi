name: Frontend CI

on:
  pull_request:
    paths: ["frontend/**"]
  push:
    branches: [main]
    paths: ["frontend/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx ng lint
      # The suite was absent here, which is how 14 failing tests in
      # sidebar.component.spec.ts stayed unnoticed until a coverage run was
      # added. --watch=false is passed explicitly: the builder defaults it to
      # true in TTY environments, and pinning it keeps the run from hanging if
      # that heuristic ever changes or a step is run interactively.
      - name: Test
        run: npx ng test --watch=false
      - name: Build
        run: npx ng build --configuration production
