[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "yel-gar"}
]
requires-python = ">=3.14,<4"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli] (>=0.141.1,<0.142.0)",
    "alembic (>=1.19.2,<2.0.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "starlette (>=1.6.0,<2.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "taskiq (>=0.12.6,<0.13.0)",
    "taskiq-aio-pika (>=0.6.0,<0.7.0)",
    "taskiq-redis (>=1.2.3,<2.0.0)",
    "taskiq-dashboard (>=0.4.4,<0.5.0)",
    "redis (>=8.1.0,<9.0.0)",
    "aioboto3 (>=15.5.0,<16.0.0)",
    "types-aiobotocore[s3] (>=3.9.1,<4.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "processing @ ../processing",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.16.6,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "testcontainers[postgres] (>=4.15.0,<5.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
]

[tool.black]
line-length = 120
target-version = ["py314"]
extend-exclude = "alembic/versions"

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = [
    "alembic/versions",
    "./createsuperuser.py"
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "ASYNC",
    "C4",
    "PIE",
    "T20",
    "Q",
    "RET",
    "SIM",
    "ARG",
    "PTH",
    "RUF"
]
ignore = [
    "PIE796",
    "B028",
    "RUF018",
    "N818",
    "B905",
    "RUF012",
    "B008",
    "RUF001",
    "RUF200"
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# `live` marks tests that talk to the real GigaChat API. They are deselected by
# default because every call costs money and needs a real SBER_API_KEY. Run them
# explicitly with:  MOCK_PROVIDER_MODE= unset, SBER_API_KEY=<real> pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: hits the real GigaChat API; deselected by default because it costs money (run with -m live)",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/__main__.py",
    "*/alembic/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
# The gate. 90% was reached on 2026-09-29 by adding suites for the chat routes,
# every TaskIQ worker, the providers, and the user/admin routes, backed by real
# PostgreSQL, Redis and MinIO testcontainers and an offline mock provider.
# pytest-cov reads this and turns the run's exit code on it, so the pre-push hook
# and the backend-coverage workflow enforce it without naming a number.
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.coverage.json]
output = "coverage.json"
