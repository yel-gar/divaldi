[project]
name = "processing"
version = "0.1.0"
description = ""
authors = [
    {name = "AX-Ray"}
]
readme = "README.md"
requires-python = ">=3.14,<4"
dependencies = [
    "pymupdf (>=1.28.2,<2.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)"
]

[tool.poetry]
packages = [{ include = "processing", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py314"]
extend-exclude = "alembic/versions"

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = [
    "alembic/versions",
    "./createsuperuser.py"
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "ASYNC",
    "C4",
    "PIE",
    "T20",
    "Q",
    "RET",
    "SIM",
    "ARG",
    "PTH",
    "RUF"
]
ignore = [
    "PIE796",
    "B028",
    "RUF018",
    "N818",
    "B905",
    "RUF012",
    "B008",
    "RUF001"
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/processing"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
# The gate. 90% was reached on 2026-10-01 by adding suites for the
# get_measurements_data entity branches, the material-price reader and the PDF
# converter's empty-document paths. pytest-cov reads this and turns the run's
# exit code on it, so the pre-push hook and the processing-coverage workflow
# enforce it without naming a number.
#
# The figure reads 96%, not 100%, because 15 statements in dxf_parser.py are
# provably unreachable: latin-1 decodes every byte sequence, so the
# UnicodeDecodeError fallback at the end of the encoding loop cannot run, and
# _get_float swallows its own ValueError/TypeError, so the per-entity
# `except ValueError, TypeError: continue` blocks can never be entered. Do not
# write tests to chase them; see .context/DECISIONS.md.
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.coverage.json]
output = "coverage.json"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.7,<0.17.0)",
    "reportlab (>=5.0.1,<6.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
